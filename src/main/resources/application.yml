server:
  port: 8082

spring:
  application:
    name: order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}  # Dirección del broker. La variable permite sobrescribir localhost en otros entornos.
    consumer:
      group-id: purchase-saga-consumer-group-id # Grupo suscriptor de la Saga para las respuestas de inventory-events-topic y payments-events-topic.
      auto-offset-reset: earliest # Si el grupo no tiene un offset guardado, comienza desde el mensaje más antiguo.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer # Los eventos se reciben como texto porque el proyecto deserializa el JSON manualmente.
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # Las claves y los eventos se publican como texto. La clave mantiene juntos los eventos del pedido.
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record # Confirma el offset de cada mensaje después de procesarlo o enviarlo a su DLT.

app:
  kafka:
    retry:
      interval-milliseconds: ${KAFKA_RETRY_INTERVAL_MILLISECONDS:2000} # Espera 2 segundos entre intentos.
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3} # Incluye el intento inicial: 1 inicial + 2 reintentos.
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-32-bytes}
